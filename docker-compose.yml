services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    platform: linux/amd64
    container_name: ecommerce-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress_password_change_me}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # WordPress 后端
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress_password_change_me}
      WP_HOME: ${WP_HOME:-http://localhost:9080}
      WP_SITEURL: ${WP_SITEURL:-http://localhost:9080}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-admin_change_me}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@example.com}
      WP_DEBUG: ${WP_DEBUG:-false}
      WP_AUTH_KEY: ${WP_AUTH_KEY:-put-your-unique-phrase-here}
      WP_SECURE_AUTH_KEY: ${WP_SECURE_AUTH_KEY:-put-your-unique-phrase-here}
      WP_LOGGED_IN_KEY: ${WP_LOGGED_IN_KEY:-put-your-unique-phrase-here}
      WP_NONCE_KEY: ${WP_NONCE_KEY:-put-your-unique-phrase-here}
      API_SECRET_KEY: ${API_SECRET_KEY:-api_secret_change_me}
    volumes:
      - wordpress_data:/var/www/html
      - ./backend/plugins:/var/www/html/wp-content/plugins/custom
      - ./backend/api:/var/www/html/api
    ports:
      - "9080:80"
    networks:
      - ecommerce-network

  # 管理后台前端
  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: ecommerce-frontend-admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "9081:80"
    networks:
      - ecommerce-network

  # 用户端前端
  frontend-user:
    build:
      context: ./frontend-user
      dockerfile: Dockerfile
    container_name: ecommerce-frontend-user
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "9082:80"
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge

volumes:
  mysql_data:
  wordpress_data:
