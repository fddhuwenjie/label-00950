<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>清除 Cookie</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 50px; }
    .btn { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 5px; }
    .success { color: green; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>清除 Cookie</h1>
  <p>点击下面按钮清除导致 400 错误的 Cookie</p>
  <button class="btn" onclick="clearCookies()">清除 Cookie</button>
  <div id="result"></div>
  <script>
    function clearCookies() {
      var cookies = document.cookie.split(';');
      var count = 0;
      for (var i = 0; i < cookies.length; i++) {
        var cookie = cookies[i];
        var name = cookie.split('=')[0].trim();
        document.cookie = name + '=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/';
        count++;
      }
      document.getElementById('result').innerHTML = '<p class="success">已清除 ' + count + ' 个 Cookie！<br><a href="/">点击返回首页</a></p>';
    }
    // 自动清除
    clearCookies();
  </script>
</body>
</html>
